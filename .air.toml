root = "."
tmp_dir = "tmp"

[build]
  bin = "tmp/main"
  cmd = "go build -o ./tmp/main ./cmd/api"
  delay = 500
  exclude_dir = ["tmp", "vendor", "docs", ".git"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "env"]
  kill_delay = "500ms"
  log = "tmp/air-build-errors.log"
  send_interrupt = true
  stop_on_error = true

[log]
  time = true

[screen]
  clear_on_rebuild = true
  keep_scroll = true